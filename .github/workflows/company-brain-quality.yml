name: Company Brain quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/open-data-source-integrations]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-key
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build Next.js application
        run: npm run build
      - name: Type-check TypeScript
        run: npx tsc --noEmit
